name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  server:
    name: Сервер — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install segno==1.6.6
      - run: python tests/test_server.py

  plugin:
    name: Плагин CLion — сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install segno==1.6.6
      - name: Сборка и тесты
        working-directory: plugin
        run: ./gradlew --no-daemon buildPlugin test
      - uses: actions/upload-artifact@v4
        with:
          name: cpsync-plugin
          path: plugin/build/distributions/*.zip
      - name: Обновить dist/cpsync-plugin.zip (его раздаёт сайт)
        if: github.event_name == 'push'
        run: |
          cp plugin/build/distributions/cpsync-plugin-*.zip dist/cpsync-plugin.zip
          if ! git diff --quiet -- dist/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/cpsync-plugin.zip
            git commit -m "Обновлён собранный плагин"
            git push
          fi
